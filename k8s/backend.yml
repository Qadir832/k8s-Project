apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2  # Hum backend ke 2 pods chala rahe hain (High Availability ke liye)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 742986823426.dkr.ecr.us-east-1.amazonaws.com/qadir-backend:latest
          env:
            - name: DATABASE_URL
              value: postgresql://admin:adminpassword@db-service:5432/devops_db
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000